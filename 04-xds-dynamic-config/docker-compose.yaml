services:
  backend-v1:
    image: hashicorp/http-echo:latest
    command: ["-text=Hello from Backend V1 🟢", "-listen=:8080"]
    expose:
      - "8080"
    networks:
      - xds-net

  backend-v2:
    image: hashicorp/http-echo:latest
    command: ["-text=Hello from Backend V2 🔵", "-listen=:8080"]
    expose:
      - "8080"
    networks:
      - xds-net

  envoy:
    image: envoyproxy/envoy:v1.30.0
    ports:
      - "9901:9901"
      - "15000:15000"
    volumes:
      - .:/etc/envoy # ◄── Mount the whole directory so inode/inotify watches persist!
    command: ["envoy", "-c", "/etc/envoy/envoy.json"]
    depends_on:
      - backend-v1
      - backend-v2
    networks:
      - xds-net

networks:
  xds-net:
    driver: bridge
