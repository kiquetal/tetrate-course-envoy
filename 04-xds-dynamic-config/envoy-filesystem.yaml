node:
  id: "local-task-01"
  cluster: "web-gateway"

# ========================================================
# FILESYSTEM-BASED DYNAMIC DISCOVERY (NO CONTROL PLANE)
# ========================================================
dynamic_resources:
  # ─── DYNAMIC LISTENERS FROM DISK ───
  lds_config:
    path_config_source:
      path: "/etc/envoy/dynamic_listeners.yaml"
    resource_api_version: V3

  # ─── DYNAMIC CLUSTERS FROM DISK ───
  cds_config:
    path_config_source:
      path: "/etc/envoy/dynamic_clusters.yaml"
    resource_api_version: V3

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 15000
